<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TarroBid — Pizza Voice Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p900:#1e0a3c;--p800:#2d1260;--p700:#3d1a82;--p600:#5227a8;
  --p500:#6d3dc7;--p400:#8f5ee0;--p300:#b48cf0;--p200:#d8bffa;--p100:#f0e6ff;--p50:#f9f5ff;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --bg:#f5f0ff;--card:#fff;--border:#ddd0f5;
  --text:#1e0a3c;--text2:#5a4a7a;--text3:#9b88bb;
  --r:10px;--sh:0 1px 3px rgba(30,10,60,.07),0 4px 14px rgba(30,10,60,.07);
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;line-height:1.5}
.shell{max-width:920px;margin:0 auto;padding:24px 18px 60px}

/* Header */
.hd{display:flex;align-items:center;gap:13px;margin-bottom:24px}
.logo{width:42px;height:42px;background:linear-gradient(135deg,var(--p700),var(--p500));border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-t{font-size:16px;font-weight:700;color:#fff;letter-spacing:-0.3px}
.hd-title{font-size:20px;font-weight:700;color:var(--p900);letter-spacing:-0.3px}
.hd-sub{font-size:11px;color:var(--text3);margin-top:2px}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pa-badge{font-size:11px;font-weight:600;background:var(--p500);color:#fff;padding:4px 12px;border-radius:20px}
.wip-badge{font-size:11px;font-weight:500;background:var(--p100);color:var(--p600);padding:4px 12px;border-radius:20px}
.bid-status-open{font-size:11px;font-weight:600;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 12px;border-radius:20px}
.bid-status-closed{font-size:11px;font-weight:600;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;padding:4px 12px;border-radius:20px}
.user-pill{font-size:11px;font-weight:600;background:var(--p200);color:var(--p800);padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
.logout-btn{background:none;border:none;cursor:pointer;color:var(--p500);font-size:13px;padding:0;font-family:'IBM Plex Sans',sans-serif}

/* Landing */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px 20px}
.landing-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--p700),var(--p500));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.landing-logo-t{font-size:26px;font-weight:700;color:#fff}
.landing-title{font-size:28px;font-weight:700;color:var(--p900);letter-spacing:-0.5px;margin-bottom:6px}
.landing-sub{font-size:14px;color:var(--text3);margin-bottom:36px}
.landing-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.landing-btn{width:180px;padding:18px 20px;border-radius:12px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s;box-shadow:var(--sh)}
.landing-btn:hover{border-color:var(--p400);background:var(--p50)}
.landing-btn-icon{font-size:28px;margin-bottom:8px}
.landing-btn-label{font-size:14px;font-weight:600;color:var(--p900)}
.landing-btn-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* Login card */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px}
.login-card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);padding:32px;width:100%;max-width:380px;text-align:center}
.login-icon{font-size:36px;margin-bottom:12px}
.login-title{font-size:17px;font-weight:700;color:var(--p900);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:22px}
.login-input{width:100%;height:42px;padding:0 14px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:10px;text-align:center;letter-spacing:1px}
.login-input:focus{border-color:var(--p400);box-shadow:0 0 0 3px rgba(109,61,199,.1)}
.login-btn{width:100%;height:42px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.login-btn:hover{background:var(--p600)}
.login-back{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;font-family:'IBM Plex Sans',sans-serif}
.login-back:hover{color:var(--p500)}
.login-err{font-size:12px;color:var(--red);margin-bottom:8px;min-height:18px}

/* Nav */
.nav{display:flex;background:var(--p900);border-radius:var(--r);padding:4px;gap:2px;margin-bottom:24px;flex-wrap:wrap}
.ntab{flex:1;min-width:70px;padding:8px 4px;font-size:12px;font-weight:500;color:rgba(255,255,255,.45);border:none;background:none;cursor:pointer;border-radius:7px;transition:all .15s;text-align:center;line-height:1.3;font-family:'IBM Plex Sans',sans-serif}
.ntab.active{background:#fff;color:var(--p800)}
.ntab:hover:not(.active){color:#fff;background:rgba(255,255,255,.1)}
.ntab .wip-tag{display:block;font-size:9px;font-weight:400;opacity:.65;margin-top:1px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.card-title{font-size:14px;font-weight:600;color:var(--p900)}
.cnt-badge{font-size:11px;font-weight:500;background:var(--p100);border:1px solid var(--p200);border-radius:12px;padding:2px 10px;color:var(--p600)}

/* Forms */
.add-bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.add-bar input{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none;min-width:0}
.add-bar input:focus{border-color:var(--p400)}
.add-bar input::placeholder{color:var(--text3)}
.f1{flex:1}.fw82{flex:0 0 82px}
.btn-add{height:38px;padding:0 16px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-add:hover{background:var(--p600)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:8px 11px;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);letter-spacing:.3px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px 11px;vertical-align:middle}
tbody tr:hover{background:var(--p50)}
.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--p100);border:1px solid var(--p200);color:var(--p600);flex-shrink:0}
.rank-num.top{background:var(--p700);border-color:var(--p700);color:#fff}
.rank-num.s2{background:var(--p200);border-color:var(--p300);color:var(--p800)}
.rank-num.s3{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.metric-input{width:74px;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;text-align:center;color:var(--text);outline:none}
.metric-input:focus{border-color:var(--p400)}
.del-btn{border:none;background:none;cursor:pointer;color:var(--text3);font-size:19px;padding:0 4px;line-height:1}
.del-btn:hover{color:var(--red)}
.tie-tag{font-size:10px;font-weight:500;background:var(--p100);color:var(--p600);padding:2px 7px;border-radius:4px;margin-left:6px}

/* Shifts */
.shift-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.shift-name{flex:1;font-size:13px;font-weight:500}

/* Bids */
.bid-card{background:var(--p50);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px}
.bid-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.bid-name{flex:1;font-weight:600;font-size:13px;color:var(--p900)}
.bid-score{font-size:11px;color:var(--text3)}
.prefs{display:flex;gap:8px;flex-wrap:wrap}
.pref-item{display:flex;flex-direction:column;gap:4px;min-width:116px}
.pref-lbl{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;align-self:flex-start;letter-spacing:.3px}
.p1-lbl{background:var(--p200);color:var(--p800)}
.p2-lbl{background:var(--p100);color:var(--p700)}
.p3-lbl{background:#ede9fe;color:#5b21b6}
.pref-sel{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--text);background:#fff;cursor:pointer;outline:none}
.pref-sel:focus{border-color:var(--p400)}
.pref-sel:disabled{opacity:.5;cursor:not-allowed;background:var(--bg)}

/* Live view */
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.live-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px}
.live-shift-head{font-size:13px;font-weight:600;color:var(--p900);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px}
.live-winner{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:var(--p50);border:1px solid var(--p200);margin-bottom:5px}
.live-winner-name{flex:1;font-size:12px;font-weight:600;color:var(--p700)}
.live-winner-score{font-size:11px;color:var(--p500);font-weight:500}
.live-contender{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;background:var(--bg);margin-bottom:3px}
.live-contender-name{flex:1;font-size:12px;color:var(--text2)}
.live-contender-score{font-size:11px;color:var(--text3)}
.live-empty{font-size:12px;color:var(--text3);font-style:italic;padding:4px 0}
.contested-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0}

/* Agent bid view */
.agent-bid-wrap{max-width:500px;margin:0 auto}
.agent-bid-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);padding:24px;margin-bottom:14px}
.agent-name-display{font-size:18px;font-weight:700;color:var(--p900);margin-bottom:4px}
.agent-rank-display{font-size:12px;color:var(--text3);margin-bottom:20px}
.agent-pref-item{margin-bottom:14px}
.agent-pref-lbl{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:5px}
.agent-pref-sel{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;cursor:pointer;outline:none}
.agent-pref-sel:focus{border-color:var(--p400)}
.agent-pref-sel:disabled{opacity:.5;cursor:not-allowed;background:var(--bg)}
.agent-save-btn{width:100%;height:42px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.agent-save-btn:hover{background:var(--p600)}
.agent-save-btn:disabled{opacity:.4;cursor:not-allowed}
.bidding-closed-banner{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:16px;text-align:center;margin-bottom:16px}
.bidding-closed-banner h3{font-size:15px;font-weight:600;color:#b91c1c;margin-bottom:4px}
.bidding-closed-banner p{font-size:12px;color:#ef4444}
.bidding-open-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 16px;text-align:center;margin-bottom:16px}
.bidding-open-banner p{font-size:12px;color:#15803d;font-weight:500}

/* Results */
.res-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fff;flex-wrap:wrap}
.shift-pill{font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;background:var(--p200);color:var(--p800)}
.no-shift{font-size:11px;color:var(--text3);font-style:italic}
.pref-note{font-size:11px;color:var(--text3)}

/* Buttons */
.btn-primary{height:38px;padding:0 18px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:var(--p600)}
.btn-ghost{height:34px;padding:0 13px;background:none;color:var(--text2);border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;cursor:pointer}
.btn-ghost:hover{background:var(--p50)}
.btn-danger{height:34px;padding:0 13px;background:none;color:var(--red);border:1px solid #fca5a5;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;cursor:pointer}
.btn-danger:hover{background:#fef2f2}
.btn-open{height:36px;padding:0 16px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.btn-open:hover{background:#dcfce7}
.btn-close-bid{height:36px;padding:0 16px;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.btn-close-bid:hover{background:#fee2e2}
.btn-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}

/* Stats */
.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-v{font-size:22px;font-weight:700;color:var(--p800);letter-spacing:-.5px}
.stat-l{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.2px}

/* Admin toggle box */
.toggle-box{background:var(--p50);border:1px solid var(--p200);border-radius:10px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.toggle-box-info h3{font-size:14px;font-weight:600;color:var(--p900);margin-bottom:2px}
.toggle-box-info p{font-size:12px;color:var(--text3)}

/* Misc */
.empty{padding:30px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:8px;line-height:1.7}
.warn{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:12px}
.success-msg{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;margin-bottom:12px}

/* Archive */
.archive-row{display:flex;align-items:center;gap:12px;padding:10px 13px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.archive-month{flex:1;font-weight:500;font-size:13px}
.archive-date{font-size:11px;color:var(--text3)}
.archive-type{font-size:11px;font-weight:600;background:var(--p100);color:var(--p600);padding:2px 8px;border-radius:10px}

/* WIP */
.wip-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;text-align:center}
.wip-icon{font-size:52px;margin-bottom:18px}
.wip-title{font-size:18px;font-weight:600;color:var(--p900);margin-bottom:8px}
.wip-desc{font-size:13px;color:var(--text3);max-width:320px;line-height:1.7}
.wip-pill{display:inline-block;font-size:11px;font-weight:600;background:var(--p100);color:var(--p600);padding:4px 14px;border-radius:20px;margin-top:18px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,10,60,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(30,10,60,.2)}
.modal-title{font-size:16px;font-weight:700;color:var(--p900);margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.modal-input{width:100%;height:40px;padding:0 13px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:16px}
.modal-input:focus{border-color:var(--p400)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--p500);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{padding:20px;text-align:center;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <!-- Header -->
  <div class="hd">
    <div class="logo"><span class="logo-t">TB</span></div>
    <div>
      <div class="hd-title">TarroBid</div>
      <div class="hd-sub">Pizza Voice Ops · Shift Bidding</div>
    </div>
    <div class="hd-right" id="hd-right">
      <span class="pa-badge">PA Bidding</span>
      <span class="wip-badge">PE — coming soon</span>
    </div>
  </div>

  <!-- Screens -->
  <div id="screen-landing"></div>
  <div id="screen-admin" style="display:none"></div>
  <div id="screen-agent" style="display:none"></div>
</div>

<!-- Reset modal -->
<div id="reset-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <div class="modal-title">Archive &amp; reset for next month</div>
    <div class="modal-desc">Saves this month's full results to the archive, then clears all bids, results, and shifts. Agents are kept.</div>
    <input class="modal-input" id="month-label" placeholder="e.g. September 2026" />
    <div id="reset-msg" style="margin-bottom:12px"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeReset()">Cancel</button>
      <button class="btn-danger" onclick="doReset()">Archive &amp; reset</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const TYPE = 'PA';
const ADMIN_PASSWORD = 'TarroBid';

let currentRole = null; // 'admin' | 'agent'
let currentAgent = null; // agent object
let adminTab = 'ranking';
let liveTimer = null;
let biddingOpen = false;
let updateTimers = {};
let bidTimers = {};

// ── INIT ──────────────────────────────────
async function init() {
  await fetchBiddingStatus();
  renderLanding();
}

async function fetchBiddingStatus() {
  try {
    const r = await api('/bidding');
    biddingOpen = r.open;
  } catch(e) { biddingOpen = false; }
}

function updateBidStatusBadge() {
  const hdRight = document.getElementById('hd-right');
  const existing = hdRight.querySelector('.bid-status-open, .bid-status-closed');
  if (existing) existing.remove();
  const badge = document.createElement('span');
  badge.className = biddingOpen ? 'bid-status-open' : 'bid-status-closed';
  badge.textContent = biddingOpen ? '🟢 Bidding Open' : '🔴 Bidding Closed';
  hdRight.appendChild(badge);
}

// ── API ───────────────────────────────────
async function api(path, method='GET', body=null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function rankClass(i) { return i===0?'top':i===1?'s2':i===2?'s3':''; }

function showScreen(name) {
  ['landing','admin','agent'].forEach(s => {
    document.getElementById('screen-'+s).style.display = s===name ? 'block' : 'none';
  });
}

// ── LANDING ───────────────────────────────
function renderLanding() {
  currentRole = null; currentAgent = null;
  updateBidStatusBadge();
  // Remove user pill if any
  const pill = document.getElementById('hd-right').querySelector('.user-pill');
  if (pill) pill.remove();

  document.getElementById('screen-landing').innerHTML = `
    <div class="landing">
      <div class="landing-logo"><span class="landing-logo-t">TB</span></div>
      <div class="landing-title">Welcome to TarroBid</div>
      <div class="landing-sub">Pizza Voice Ops · Monthly Shift Bidding</div>
      <div class="landing-btns">
        <button class="landing-btn" onclick="showAdminLogin()">
          <div class="landing-btn-icon">🔐</div>

async function doAgentLogin() {

  try {

async function addAgent() {

  document.getElementById('a-adh').value='';
  document.getElementById('a-aht').value='';
  await renderAdminRanking();

function updateAgent(id,adh,aht) {
  clearTimeout(updateTimers[id]);
  updateTimers[id] = setTimeout(async () => {
    const agents = await api(`/agents?type=${TYPE}`);
    const agent = agents.find(a=>a.id===id);
    if (!agent) return;
    await api(`/agents?id=${id}`,'PUT',{
      adherence: adh!==null ? parseFloat(adh) : agent.adherence,
      aht: aht!==null ? parseFloat(aht) : agent.aht,

    await renderAdminRanking();

}

// ── LIVE VIEW (shared) ────────────────────
async function renderLiveView(paneId) {
  const el = document.getElementById(paneId);
  await fetchBiddingStatus();
  updateBidStatusBadge();
  const [agents, shifts, bids] = await Promise.all([
    api(`/agents?type=${TYPE}`),
    api(`/shifts?type=${TYPE}`),
    api(`/bids?type=${TYPE}`),
  ]);
  if (!shifts.length) { el.innerHTML='<div class="card"><div class="empty">No shifts added yet.</div></div>'; return; }
  const bidMap = Object.fromEntries(bids.map(b=>[b.agent_id,b]));
  const shiftMap = Object.fromEntries(shifts.map(s=>[s.id,{shift:s,contenders:[]}]));
  agents.forEach((a,rank) => {
    const b = bidMap[a.id]; if(!b) return;
    [['pref1_shift_id',1],['pref2_shift_id',2],['pref3_shift_id',3]].forEach(([col,pref])=>{
      const sid=b[col]; if(sid&&shiftMap[sid]) shiftMap[sid].contenders.push({agent:a,pref});
    });
  });
  const taken=new Set(); const winners={};
  agents.forEach(a => {
    const b=bidMap[a.id]||{};
    for(const col of['pref1_shift_id','pref2_shift_id','pref3_shift_id']){
      const sid=b[col]; if(sid&&!taken.has(sid)){taken.add(sid);winners[sid]=a.id;break;}
    }
  });
  el.innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <div class="card-head" style="margin-bottom:4px">
        <span class="card-title">Live bid board — PA</span>
        <span style="font-size:11px;color:var(--text3)">Refreshes every 4s</span>
      </div>
      <p style="font-size:12px;color:var(--text3)">Purple = projected winner · Contested = multiple bidders</p>
    </div>
    ${bids.length===0?'<div class="empty">No bids placed yet.</div>':''}
    <div class="live-grid">
      ${shifts.map(s=>{
        const info=shiftMap[s.id];
        const winnerId=winners[s.id];
        const winner=winnerId?agents.find(a=>a.id===winnerId):null;
        const others=info.contenders.filter(c=>c.agent.id!==winnerId);
        return `<div class="live-card">
          <div class="live-shift-head">
            <span>${s.name}</span>
            ${others.length?`<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:10px;font-weight:600">Contested</span>`:''}
          </div>
          ${winner?`<div class="live-winner"><span style="font-size:14px">👑</span><span class="live-winner-name">${winner.pos_id||winner.name}</span><span class="live-winner-score">${winner.adherence}%</span></div>`:`<div class="live-empty">No bids yet</div>`}
          ${others.slice(0,3).map(c=>`<div class="live-contender"><div class="contested-dot"></div><span class="live-contender-name">${c.agent.pos_id||c.agent.name}</span><span class="live-contender-score">${c.agent.adherence}% · ${c.pref}${c.pref===1?'st':c.pref===2?'nd':'rd'}</span></div>`).join('')}
          ${others.length>3?`<div style="font-size:11px;color:var(--text3);padding:4px 9px">+${others.length-3} more</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
}

// ── RESET ─────────────────────────────────
function openReset() {
  const d=new Date(); d.setMonth(d.getMonth()+1);
  document.getElementById('month-label').value=d.toLocaleString('default',{month:'long'})+' '+d.getFullYear();
  document.getElementById('reset-msg').innerHTML='';
  document.getElementById('reset-modal').style.display='flex';
}
function closeReset() { document.getElementById('reset-modal').style.display='none'; }
async function doReset() {
  const label=document.getElementById('month-label').value.trim();
  if (!label) return;
  const msgEl=document.getElementById('reset-msg');
  msgEl.innerHTML='<span class="spinner"></span>Archiving…';
  try {
    const res=await api('/reset','POST',{month_label:label,type:TYPE});
    msgEl.innerHTML=`<div class="success-msg">✓ ${res.message}</div>`;
    setTimeout(()=>{ closeReset(); goAdmin('ranking'); },1500);
  } catch(e) { msgEl.innerHTML=`<div class="warn">Error: ${e.message}</div>`; }
}

// ── AGENT SHELL ───────────────────────────
function renderAgentShell() {
  updateBidStatusBadge();
  let pill = document.getElementById('hd-right').querySelector('.user-pill');
  if (!pill) {
    pill = document.createElement('span');
    pill.className = 'user-pill';
    document.getElementById('hd-right').appendChild(pill);
  }
  pill.innerHTML = `${currentAgent.pos_id||currentAgent.name} <button class="logout-btn" onclick="renderLanding()">× Exit</button>`;

  document.getElementById('screen-agent').innerHTML = `
    <div class="nav">
      <button class="ntab active" onclick="goAgent('bid')">My Bid</button>
      <button class="ntab" onclick="goAgent('live')">Live View</button>
    </div>
    <div id="agent-pane-bid"></div>
    <div id="agent-pane-live" style="display:none"></div>`;
  showScreen('agent');
  goAgent('bid');
}

function goAgent(tab) {
  if (liveTimer) { clearInterval(liveTimer); liveTimer=null; }
  ['bid','live'].forEach((t,i)=>{
    document.getElementById('agent-pane-'+t).style.display=t===tab?'block':'none';
    document.querySelectorAll('#screen-agent .ntab')[i].classList.toggle('active',t===tab);
  });
  if (tab==='bid')  renderAgentBid();
  if (tab==='live') { renderLiveView('agent-pane-live'); liveTimer=setInterval(()=>renderLiveView('agent-pane-live'),4000); }
}

async function renderAgentBid() {
  const el = document.getElementById('agent-pane-bid');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span>Loading…</div>';
  await fetchBiddingStatus();
  updateBidStatusBadge();
  const [agents, shifts, bids] = await Promise.all([
    api(`/agents?type=${TYPE}`),
    api(`/shifts?type=${TYPE}`),
    api(`/bids?type=${TYPE}`),
  ]);
  const sortedAgents = [...agents].sort((a,b)=>{ if(b.adherence!==a.adherence)return b.adherence-a.adherence; return a.aht-b.aht; });
  const myRank = sortedAgents.findIndex(a=>a.id===currentAgent.id)+1;
  const myBid = bids.find(b=>b.agent_id===currentAgent.id)||{};
  const opts = shifts.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const locked = !biddingOpen;

  el.innerHTML = `
    <div class="agent-bid-wrap">
      ${locked
        ? `<div class="bidding-closed-banner"><h3>🔴 Bidding is closed</h3><p>Your TL will open bidding shortly.</p></div>`
        : `<div class="bidding-open-banner"><p>🟢 Bidding is open — select your shift preferences below.</p></div>`}
      <div class="agent-bid-card">
        <div class="agent-name-display">${currentAgent.pos_id||currentAgent.name}</div>
        <div class="agent-rank-display">Rank #${myRank} · Adherence: ${currentAgent.adherence}% · AHT: ${currentAgent.aht}s</div>

        <div class="agent-pref-item">
          <span class="agent-pref-lbl p1-lbl">1st choice</span>
          <select class="agent-pref-sel" id="ap1" ${locked?'disabled':''}>
            <option value="">— pick a shift —</option>${opts}
          </select>
        </div>
        <div class="agent-pref-item">
          <span class="agent-pref-lbl p2-lbl">2nd choice</span>
          <select class="agent-pref-sel" id="ap2" ${locked?'disabled':''}>
            <option value="">— pick a shift —</option>${opts}
          </select>
        </div>
        <div class="agent-pref-item">
          <span class="agent-pref-lbl p3-lbl">3rd choice</span>
          <select class="agent-pref-sel" id="ap3" ${locked?'disabled':''}>
            <option value="">— pick a shift —</option>${opts}
          </select>
        </div>
        <button class="agent-save-btn" onclick="saveAgentBid()" ${locked?'disabled':''}>Save my preferences</button>
        <div id="agent-bid-msg" style="margin-top:10px;font-size:12px;text-align:center"></div>
      </div>
    </div>`;

  // Restore saved
  if (myBid.pref1_shift_id) document.getElementById('ap1').value = myBid.pref1_shift_id;
  if (myBid.pref2_shift_id) document.getElementById('ap2').value = myBid.pref2_shift_id;
  if (myBid.pref3_shift_id) document.getElementById('ap3').value = myBid.pref3_shift_id;
}

async function saveAgentBid() {
  const p1=parseInt(document.getElementById('ap1').value)||null;
  const p2=parseInt(document.getElementById('ap2').value)||null;
  const p3=parseInt(document.getElementById('ap3').value)||null;
  const msgEl=document.getElementById('agent-bid-msg');
  try {
    await api('/bids','POST',{agent_id:currentAgent.id,pref1_shift_id:p1,pref2_shift_id:p2,pref3_shift_id:p3});
    msgEl.innerHTML='<span style="color:var(--green)">✓ Preferences saved!</span>';
    showToast('✓ Bid saved!');
    setTimeout(()=>msgEl.innerHTML='',3000);
  } catch(e) { msgEl.innerHTML=`<span style="color:var(--red)">Error saving. Try again.</span>`; }
}

// ── PE WIP ────────────────────────────────
function renderPE(paneId) {
  document.getElementById(paneId).innerHTML=`
    <div class="card">
      <div class="wip-screen">
        <div class="wip-icon">🚧</div>
        <div class="wip-title">PE Bidding</div>
        <div class="wip-desc">Pizza Expert shift bidding is being built. Same ranking, bid preferences, and live board as PA.</div>
        <span class="wip-pill">Work in progress</span>
      </div>
    </div>`;
}

function showToast(msg, type='success') {
  const t = document.createElement('div');
  const bg = type==='error' ? 'var(--red)' : type==='warn' ? 'var(--amber)' : 'var(--p700)';
  t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${bg};color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:500;font-family:'IBM Plex Sans',sans-serif;box-shadow:0 4px 16px rgba(30,10,60,.25);z-index:9999;opacity:1;transition:opacity .3s`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 300); }, 2200);
}

init();
</script>
</body>
