<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TarroBid — Pizza Voice Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p900:#1e0a3c;--p800:#2d1260;--p700:#3d1a82;--p600:#5227a8;
  --p500:#6d3dc7;--p400:#8f5ee0;--p300:#b48cf0;--p200:#d8bffa;--p100:#f0e6ff;--p50:#f9f5ff;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --bg:#f5f0ff;--card:#fff;--border:#ddd0f5;
  --text:#1e0a3c;--text2:#5a4a7a;--text3:#9b88bb;
  --r:10px;--sh:0 1px 3px rgba(30,10,60,.07),0 4px 14px rgba(30,10,60,.07);
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;line-height:1.5}
.shell{max-width:920px;margin:0 auto;padding:24px 18px 60px}
.hd{display:flex;align-items:center;gap:13px;margin-bottom:24px}
.logo{width:42px;height:42px;background:linear-gradient(135deg,var(--p700),var(--p500));border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-t{font-size:16px;font-weight:700;color:#fff}
.hd-title{font-size:20px;font-weight:700;color:var(--p900)}
.hd-sub{font-size:11px;color:var(--text3);margin-top:2px}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pa-badge{font-size:11px;font-weight:600;background:var(--p500);color:#fff;padding:4px 12px;border-radius:20px}
.pe-badge{font-size:11px;font-weight:600;background:var(--p300);color:var(--p900);padding:4px 12px;border-radius:20px}
.bid-open{font-size:11px;font-weight:600;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:4px 12px;border-radius:20px}
.bid-closed{font-size:11px;font-weight:600;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;padding:4px 12px;border-radius:20px}
.user-pill{font-size:11px;font-weight:600;background:var(--p200);color:var(--p800);padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
.logout-btn{background:none;border:none;cursor:pointer;color:var(--p500);font-size:13px;padding:0;font-family:'IBM Plex Sans',sans-serif}
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px 20px}
.landing-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--p700),var(--p500));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.landing-logo-t{font-size:26px;font-weight:700;color:#fff}
.landing-title{font-size:28px;font-weight:700;color:var(--p900);margin-bottom:6px}
.landing-sub{font-size:14px;color:var(--text3);margin-bottom:36px}
.landing-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.landing-btn{width:180px;padding:18px 20px;border-radius:12px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s;box-shadow:var(--sh)}
.landing-btn:hover{border-color:var(--p400);background:var(--p50)}
.landing-btn-icon{font-size:28px;margin-bottom:8px}
.landing-btn-label{font-size:14px;font-weight:600;color:var(--p900)}
.landing-btn-sub{font-size:11px;color:var(--text3);margin-top:3px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px}
.login-card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh);padding:32px;width:100%;max-width:380px;text-align:center}
.login-icon{font-size:36px;margin-bottom:12px}
.login-title{font-size:17px;font-weight:700;color:var(--p900);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:22px}
.login-input{width:100%;height:42px;padding:0 14px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:10px;text-align:center}
.login-input:focus{border-color:var(--p400)}
.login-btn{width:100%;height:42px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.login-btn:hover{background:var(--p600)}
.login-back{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;font-family:'IBM Plex Sans',sans-serif}
.login-err{font-size:12px;color:var(--red);margin-bottom:8px;min-height:18px}
.nav{display:flex;background:var(--p900);border-radius:var(--r);padding:4px;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.nav.sub{background:var(--p800);margin-bottom:24px}
.ntab{flex:1;min-width:70px;padding:8px 4px;font-size:12px;font-weight:500;color:rgba(255,255,255,.45);border:none;background:none;cursor:pointer;border-radius:7px;transition:all .15s;text-align:center;font-family:'IBM Plex Sans',sans-serif}
.ntab.active{background:#fff;color:var(--p800)}
.ntab:hover:not(.active){color:#fff;background:rgba(255,255,255,.1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.card-title{font-size:14px;font-weight:600;color:var(--p900)}
.cnt-badge{font-size:11px;font-weight:500;background:var(--p100);border:1px solid var(--p200);border-radius:12px;padding:2px 10px;color:var(--p600)}
.add-bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.add-bar input{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;outline:none;min-width:0}
.add-bar input:focus{border-color:var(--p400)}
.add-bar input::placeholder{color:var(--text3)}
.f1{flex:1}.fw82{flex:0 0 82px}.fw90{flex:0 0 90px}
.btn-add{height:38px;padding:0 16px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-add:hover{background:var(--p600)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:8px 11px;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px 11px;vertical-align:middle}
tbody tr:hover{background:var(--p50)}
.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--p100);border:1px solid var(--p200);color:var(--p600);flex-shrink:0}
.rank-num.top{background:var(--p700);border-color:var(--p700);color:#fff}
.rank-num.s2{background:var(--p200);border-color:var(--p300);color:var(--p800)}
.rank-num.s3{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.metric-input{width:74px;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;text-align:center;color:var(--text);outline:none}
.metric-input:focus{border-color:var(--p400)}
.del-btn{border:none;background:none;cursor:pointer;color:var(--text3);font-size:19px;padding:0 4px;line-height:1}
.del-btn:hover{color:var(--red)}
.tie-tag{font-size:10px;font-weight:500;background:var(--p100);color:var(--p600);padding:2px 7px;border-radius:4px;margin-left:6px}
.shift-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.shift-name{flex:1;font-size:13px;font-weight:500}
.bid-card{background:var(--p50);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px}
.bid-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.bid-name{flex:1;font-weight:600;font-size:13px;color:var(--p900)}
.bid-score{font-size:11px;color:var(--text3)}
.prefs{display:flex;gap:8px;flex-wrap:wrap}
.pref-item{display:flex;flex-direction:column;gap:4px;min-width:116px}
.pref-lbl{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;align-self:flex-start}
.p1-lbl{background:var(--p200);color:var(--p800)}
.p2-lbl{background:var(--p100);color:var(--p700)}
.p3-lbl{background:#ede9fe;color:#5b21b6}
.pref-sel{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--text);background:#fff;cursor:pointer;outline:none}
.pref-sel:disabled{opacity:.5;cursor:not-allowed;background:var(--bg)}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.live-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px}
.live-shift-head{font-size:13px;font-weight:600;color:var(--p900);margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px}
.live-winner{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:var(--p50);border:1px solid var(--p200);margin-bottom:5px}
.live-winner-name{flex:1;font-size:12px;font-weight:600;color:var(--p700)}
.live-winner-score{font-size:11px;color:var(--p500);font-weight:500}
.live-contender{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;background:var(--bg);margin-bottom:3px}
.live-contender-name{flex:1;font-size:12px;color:var(--text2)}
.live-contender-score{font-size:11px;color:var(--text3)}
.live-empty{font-size:12px;color:var(--text3);font-style:italic;padding:4px 0}
.contested-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0}
.agent-bid-wrap{max-width:500px;margin:0 auto}
.agent-bid-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);padding:24px;margin-bottom:14px}
.agent-name-display{font-size:18px;font-weight:700;color:var(--p900);margin-bottom:4px}
.agent-rank-display{font-size:12px;color:var(--text3);margin-bottom:20px}
.agent-pref-item{margin-bottom:14px}
.agent-pref-lbl{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:5px}
.agent-pref-sel{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--text);background:#fff;cursor:pointer;outline:none}
.agent-pref-sel:disabled{opacity:.5;cursor:not-allowed;background:var(--bg)}
.agent-save-btn{width:100%;height:42px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.agent-save-btn:hover{background:var(--p600)}
.agent-save-btn:disabled{opacity:.4;cursor:not-allowed}
.bid-closed-banner{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:16px;text-align:center;margin-bottom:16px}
.bid-closed-banner h3{font-size:15px;font-weight:600;color:#b91c1c;margin-bottom:4px}
.bid-closed-banner p{font-size:12px;color:#ef4444}
.bid-open-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 16px;text-align:center;margin-bottom:16px}
.bid-open-banner p{font-size:12px;color:#15803d;font-weight:500}
.ann-banner{background:#fff;border:1px solid var(--border);border-left:4px solid var(--p500);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.ann-icon{width:32px;height:32px;background:var(--p100);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ann-tag{font-size:10px;font-weight:600;background:var(--p100);color:#5227a8;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:4px}
.ann-text{font-size:13px;color:var(--text);line-height:1.6}
.res-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:#fff;flex-wrap:wrap}
.shift-pill{font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;background:var(--p200);color:var(--p800)}
.no-shift{font-size:11px;color:var(--text3);font-style:italic}
.pref-note{font-size:11px;color:var(--text3)}
.btn-primary{height:38px;padding:0 18px;background:var(--p700);color:#fff;border:none;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:var(--p600)}
.btn-ghost{height:34px;padding:0 13px;background:none;color:var(--text2);border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;cursor:pointer}
.btn-ghost:hover{background:var(--p50)}
.btn-danger{height:34px;padding:0 13px;background:none;color:var(--red);border:1px solid #fca5a5;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;cursor:pointer}
.btn-danger:hover{background:#fef2f2}
.btn-open{height:36px;padding:0 16px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.btn-open:hover{background:#dcfce7}
.btn-close-bid{height:36px;padding:0 16px;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.btn-close-bid:hover{background:#fee2e2}
.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-v{font-size:22px;font-weight:700;color:var(--p800);letter-spacing:-.5px}
.stat-l{font-size:11px;color:var(--text3);margin-top:2px}
.toggle-box{background:var(--p50);border:1px solid var(--p200);border-radius:10px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.toggle-box-info h3{font-size:14px;font-weight:600;color:var(--p900);margin-bottom:2px}
.toggle-box-info p{font-size:12px;color:var(--text3)}
.empty{padding:30px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:8px;line-height:1.7}
.warn{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:12px}
.success-msg{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;margin-bottom:12px}
.archive-row{display:flex;align-items:center;gap:12px;padding:10px 13px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.archive-month{flex:1;font-weight:500;font-size:13px}
.archive-date{font-size:11px;color:var(--text3)}
.archive-type{font-size:11px;font-weight:600;background:var(--p100);color:var(--p600);padding:2px 8px;border-radius:10px}
.modal-bg{position:fixed;inset:0;background:rgba(30,10,60,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(30,10,60,.2)}
.modal-title{font-size:16px;font-weight:700;color:var(--p900);margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.modal-input{width:100%;height:40px;padding:0 13px;border:1px solid var(--border);border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--p500);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{padding:20px;text-align:center;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <div class="hd">
    <div class="logo"><span class="logo-t">TB</span></div>
    <div>
      <div class="hd-title">TarroBid</div>
      <div class="hd-sub">Pizza Voice Ops · Shift Bidding</div>
    </div>
    <div class="hd-right" id="hd-right">
      <span id="type-badge" class="wip-badge" style="background:var(--p100);color:var(--p600)">Shift Bidding</span>
    </div>
  </div>
  <div id="screen-landing"></div>
  <div id="screen-admin" style="display:none"></div>
  <div id="screen-agent" style="display:none"></div>
</div>

<div id="reset-modal" class="modal-bg" style="display:none">
  <div class="modal">
    <div class="modal-title">Archive &amp; reset for next month</div>
    <div class="modal-desc">Saves this month's full results to the archive, then clears bids, results, and shifts. Agents are kept.</div>
    <input class="modal-input" id="month-label" placeholder="e.g. October 2026"/>
    <div id="reset-msg" style="margin-bottom:12px"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeReset()">Cancel</button>
      <button class="btn-danger" onclick="doReset()">Archive &amp; reset</button>
    </div>
  </div>
</div>

<script>
var API = '/api';
var ADMIN_PW = 'TarroBid';
var TYPE = 'PA';
var currentRole = null;
var currentAgent = null;
var adminTab = 'ranking';
var liveTimer = null;
var resultsTimer = null;
var biddingOpen = false;
var updateTimers = {};
var bidTimers = {};

function showToast(msg, type) {
  var bg = type === 'error' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--p700)';
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:' + bg + ';color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:500;font-family:IBM Plex Sans,sans-serif;box-shadow:0 4px 16px rgba(30,10,60,.25);z-index:9999;transition:opacity .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 2200);
}

function rankClass(i) { return i === 0 ? 'top' : i === 1 ? 's2' : i === 2 ? 's3' : ''; }

function showScreen(name) {
  ['landing', 'admin', 'agent'].forEach(function(s) {
    var el = document.getElementById('screen-' + s);
    if (el) el.style.display = s === name ? 'block' : 'none';
  });
}

function updateTypeBadge() {
  var b = document.getElementById('type-badge');
  if (!b) return;
  b.textContent = TYPE + ' Bidding';
  b.className = TYPE === 'PE' ? 'pe-badge' : 'pa-badge';
}

function updateBidStatusBadge() {
  var hdRight = document.getElementById('hd-right');
  if (!hdRight) return;
  var existing = hdRight.querySelector('.bid-open, .bid-closed');
  if (existing) existing.remove();
  var badge = document.createElement('span');
  badge.className = biddingOpen ? 'bid-open' : 'bid-closed';
  badge.textContent = biddingOpen ? '🟢 Bidding Open' : '🔴 Bidding Closed';
  hdRight.appendChild(badge);
}

async function apiFetch(path, method, body) {
  method = method || 'GET';
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function fetchBiddingStatus() {
  try { var r = await apiFetch('/bidding?type=' + TYPE); biddingOpen = r.open; } catch(e) { biddingOpen = false; }
}

async function fetchAnnouncement() {
  try { var r = await apiFetch('/announcement'); return r.message || ''; } catch(e) { return ''; }
}

function showAnnouncement(msg, containerId) {
  var el = document.getElementById(containerId);
  if (!el) return;
  if (!msg || !msg.trim()) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="ann-banner"><div class="ann-icon">&#128226;</div><div><span class="ann-tag">Announcement</span><div class="ann-text">' + msg + '</div></div></div>';
}

async function init() {
  try { await fetchBiddingStatus(); } catch(e) {}
  renderLanding();
}

// ── LANDING ──────────────────────────────────────────────
function renderLanding() {
  currentRole = null; currentAgent = null;
  try { updateBidStatusBadge(); } catch(e) {}
  var badge = document.getElementById('type-badge');

// ── ADMIN LOGIN ──────────────────────────────────────────
function showAdminLogin() {
  document.getElementById('screen-landing').innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
    '<div class="login-icon">&#128272;</div>' +
    '<div class="login-title">Admin access</div>' +

function doAdminLogin() {

// ── AGENT LOGIN ──────────────────────────────────────────
function showAgentLogin() {
  document.getElementById('screen-landing').innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
    '<div class="login-icon">&#128100;</div>' +
    '<div class="login-title">Agent login</div>' +

    '<div class="login-err" id="agent-err"></div>' +
    '<input class="login-input" id="agent-pos" type="text" placeholder="POS ID" style="text-transform:uppercase"/>' +

    '<button class="login-back" onclick="renderLanding()">&#8592; Back</button>' +
    '</div></div>';
  var pos = document.getElementById('agent-pos');
  pos.addEventListener('keydown', function(e) { if (e.key === 'Enter') doAgentLogin(); });
  pos.focus();
}

async function doAgentLogin() {
  var posId = document.getElementById('agent-pos').value.trim().toUpperCase();
  if (!posId) { document.getElementById('agent-err').textContent = 'Enter your POS ID.'; return; }
  try {
    var pa = await apiFetch('/agents?type=PA');
    var pe = await apiFetch('/agents?type=PE');
    var all = pa.concat(pe);
    var agent = all.find(function(a) { return a.pos_id && a.pos_id.toUpperCase() === posId; });
    if (!agent) { document.getElementById('agent-err').textContent = 'POS ID not found. Check with your TL.'; return; }
    currentRole = 'agent'; currentAgent = agent;
    TYPE = agent.agent_type || 'PA';
    renderAgentShell();
  } catch(e) { document.getElementById('agent-err').textContent = 'Error connecting. Try again.'; }
}

function switchGroup(group) {
  TYPE = group; updateTypeBadge();
  document.getElementById('grp-PA').classList.toggle('active', group === 'PA');
  document.getElementById('grp-PE').classList.toggle('active', group === 'PE');
  document.getElementById('grp-archive').classList.remove('active');
  document.getElementById('sub-nav').style.display = 'flex';
  goAdmin('ranking');
}

function showArchivePane() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if (resultsTimer) { clearInterval(resultsTimer); resultsTimer = null; }
  document.getElementById('grp-PA').classList.remove('active');
  document.getElementById('grp-PE').classList.remove('active');
  document.getElementById('grp-archive').classList.add('active');
  document.getElementById('sub-nav').style.display = 'none';
  ['ranking','shifts','bids','live','results'].forEach(function(t) {
    document.getElementById('apane-' + t).style.display = 'none';
  });
  document.getElementById('apane-archive').style.display = 'block';
  renderAdminArchive();
}

function goAdmin(tab) {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if (resultsTimer) { clearInterval(resultsTimer); resultsTimer = null; }
  adminTab = tab;
  document.getElementById('sub-nav').style.display = 'flex';
  ['ranking','shifts','bids','live','results'].forEach(function(t) {
    document.getElementById('sub-' + t).classList.toggle('active', t === tab);
    document.getElementById('apane-' + t).style.display = t === tab ? 'block' : 'none';
  });
  document.getElementById('apane-archive').style.display = 'none';
  if (tab === 'ranking') renderAdminRanking();
  if (tab === 'shifts')  renderAdminShifts();
  if (tab === 'bids')    renderAdminBids();
  if (tab === 'live')    { renderLiveView('apane-live'); liveTimer = setInterval(function() { renderLiveView('apane-live'); }, 4000); }
  if (tab === 'results') renderAdminResults();
}

function refreshAdmin() { goAdmin(adminTab); showToast('Refreshed (' + TYPE + ')'); }

// ── RANKING ──────────────────────────────────────────────
async function renderAdminRanking() {

    await fetchBiddingStatus(); updateBidStatusBadge();

    var shifts = await apiFetch('/shifts?type=' + TYPE);

    var shiftMap = {};
    shifts.forEach(function(s) { shiftMap[s.id] = s; });
    var bidMap = {};
    bids.forEach(function(b) { bidMap[b.agent_id] = b; });
    var label = TYPE === 'PE' ? 'Pizza Expert' : 'Pizza Agent';

    var html = '';

    

    // Stats
    html += '<div class="stats">' +
      '<div class="stat"><div class="stat-v">' + agents.length + '</div><div class="stat-l">Total ' + TYPE + 's</div></div>' +
      '<div class="stat"><div class="stat-v">' + shifts.length + '</div><div class="stat-l">Shifts</div></div>' +
      '<div class="stat"><div class="stat-v">' + bids.length + '</div><div class="stat-l">Bids placed</div></div>' +
      '</div>';

    html += '<div class="toggle-box">' +
      '<div class="toggle-box-info"><h3>Bidding window &mdash; ' + TYPE + '</h3><p>' + (biddingOpen ? 'Agents can submit bids.' : 'Bidding is closed.') + '</p></div>' +
      (biddingOpen
        ? '<button class="btn-close-bid" onclick="toggleBidding(false)">&#128308; Close bidding</button>'
        : '<button class="btn-open" onclick="toggleBidding(true)">&#128994; Open bidding</button>') +
      '</div>';

    // Ranking card
    html += '<div class="card">' +
      '<div class="card-head">' +
      '<span class="card-title">' + label + ' Ranking</span>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<span class="cnt-badge">' + agents.length + ' agents</span>' +
      '<button class="btn-danger" onclick="openReset()" style="height:30px;font-size:11px">&#8635; New month</button>' +
      '</div></div>' +
      '' +
      '<div class="add-bar">' +
      '<input class="f1" id="a-name" placeholder="Agent name"/>' +
      '<input class="fw90" id="a-pos" placeholder="POS ID"/>' +
      '<input class="fw82" id="a-adh" placeholder="Adh %" type="number" min="0" max="100" step="0.01"/>' +
      '<input class="fw82" id="a-aht" placeholder="AHT (s)" type="number" min="0" step="1"/>' +
      '<button class="btn-add" onclick="addAgent()">+ Add</button>' +
      '</div>';

    if (!agents.length) {
      html += '<div class="empty">No ' + TYPE + 's yet. Add one above.</div>';
    } else {
      html += '<table><thead><tr><th style="width:36px">#</th><th>Name</th><th>POS ID</th><th>Adherence %</th><th>AHT (s)</th><th>1st bid</th><th></th></tr></thead><tbody>';
      agents.forEach(function(a, i) {
        var isTie = i > 0 && agents[i-1].adherence === a.adherence;
        var bid = bidMap[a.id];
        var s1 = bid && bid.pref1_shift_id ? shiftMap[bid.pref1_shift_id] : null;
        html += '<tr>' +
          '<td><div class="rank-num ' + rankClass(i) + '">' + (i+1) + '</div></td>' +
          '<td style="font-weight:500">' + (a.name || a.pos_id) + (isTie ? '<span class="tie-tag">AHT tb</span>' : '') + '</td>' +
          '<td style="font-size:12px;color:var(--text3)">' + (a.pos_id || '—') + '</td>' +
          '<td><input class="metric-input" type="number" min="0" max="100" step="0.01" value="' + a.adherence + '" onchange="updateAgent(' + a.id + ',this.value,null)"/></td>' +
          '<td><input class="metric-input" type="number" min="0" step="1" value="' + a.aht + '" onchange="updateAgent(' + a.id + ',null,this.value)"/></td>' +
          '<td>' + (s1 ? '<span class="shift-pill">' + s1.name + '</span>' : '<span style="font-size:12px;color:var(--text3)">—</span>') + '</td>' +
          '<td><button class="del-btn" onclick="delAgent(' + a.id + ')">&#215;</button></td>' +

    document.getElementById('a-name').addEventListener('keydown', function(e) { if (e.key === 'Enter') addAgent(); });
  } catch(e) {
    el.innerHTML = '<div class="warn">Error loading: ' + e.message + '</div>';

async function toggleBidding(open) {
  await apiFetch('/bidding', 'POST', { open: open, type: TYPE }); biddingOpen = open;
  showToast(open ? TYPE + ' bidding is now open!' : TYPE + ' bidding closed');
  renderAdminRanking(); updateBidStatusBadge();
}

async function saveAnnouncement() {
  var msg = document.getElementById('ann-text').value.trim();
  await apiFetch('/announcement', 'POST', { message: msg });
  showToast('Announcement saved!');
}

async function clearAnnouncement() {
  document.getElementById('ann-text').value = '';
  await apiFetch('/announcement', 'POST', { message: '' });
  showToast('Announcement cleared', 'warn');
}

async function addAgent() {
  var name  = document.getElementById('a-name').value.trim();
  var posId = document.getElementById('a-pos').value.trim().toUpperCase();
  var adh   = parseFloat(document.getElementById('a-adh').value);
  var aht   = parseFloat(document.getElementById('a-aht').value);
  if (!name || !posId || isNaN(adh) || isNaN(aht)) return;
  await apiFetch('/agents','POST',{name:name,pos_id:posId,adherence:adh,aht:aht,agent_type:TYPE});
  document.getElementById('a-name').value=''; document.getElementById('a-pos').value='';
  document.getElementById('a-adh').value=''; document.getElementById('a-aht').value='';
  showToast('Agent added!'); await renderAdminRanking();
  document.getElementById('a-name').focus();
}

function updateAgent(id, adh, aht) {
  clearTimeout(updateTimers[id]);
  updateTimers[id] = setTimeout(async function() {
    var agents = await apiFetch('/agents?type=' + TYPE);
    var agent = agents.find(function(a) { return a.id === id; });
    if (!agent) return;
    await apiFetch('/agents?id='+id,'PUT',{
      adherence: adh !== null ? parseFloat(adh) : agent.adherence,
      aht: aht !== null ? parseFloat(aht) : agent.aht
    });
    await renderAdminRanking();
  }, 700);
}

async function delAgent(id) {
  if (!confirm('Remove this agent?')) return;
  await apiFetch('/agents?id='+id,'DELETE');
  showToast('Agent removed','warn'); await renderAdminRanking();
}

async function delShift(id) {

function startShiftEdit(id) {

async function saveShiftEdit(id) {

// ── BIDS ─────────────────────────────────────────────────
async function renderAdminBids() {
  var el = document.getElementById('apane-bids');

  try {

    var bidMap = {};
    bids.forEach(function(b) { bidMap[b.agent_id] = b; });
    var opts = shifts.map(function(s) { return '<option value="'+s.id+'">'+s.name+'</option>'; }).join('');
    var locked = !biddingOpen;
    var html = (locked
      ? '<div class="warn">&#9888; Bidding is closed. Open it on the Ranking tab.</div>'
      : '<div class="success-msg">&#10003; Bidding is open.</div>') +
      '<div class="card"><div class="card-head"><span class="card-title">'+TYPE+' Bids</span><span class="cnt-badge">'+bids.length+'/'+agents.length+' submitted</span></div>';
    agents.forEach(function(a, i) {
      var b = bidMap[a.id] || {};
      html += '<div class="bid-card"><div class="bid-head">' +
        '<div class="rank-num '+rankClass(i)+'" style="flex-shrink:0">'+(i+1)+'</div>' +
        '<span class="bid-name">'+(a.name||a.pos_id)+'</span>' +
        '<span class="bid-score">Adh: '+a.adherence+'% &middot; AHT: '+a.aht+'s</span>' +
        '</div><div class="prefs">' +
        [['pref1_shift_id','1st choice','p1-lbl'],['pref2_shift_id','2nd choice','p2-lbl'],['pref3_shift_id','3rd choice','p3-lbl']].map(function(arr) {
          return '<div class="pref-item"><span class="pref-lbl '+arr[2]+'">'+arr[1]+'</span>' +
            '<select class="pref-sel" data-agent="'+a.id+'" data-col="'+arr[0]+'" onchange="saveBid('+a.id+')" '+(locked?'disabled':'')+'>'+
            '<option value="">-- pick a shift --</option>'+opts+'</select></div>';
        }).join('') +
        '</div></div>';
    });
    html += '</div>';
    el.innerHTML = html;
    agents.forEach(function(a) {
      var b = bidMap[a.id] || {};
      ['pref1_shift_id','pref2_shift_id','pref3_shift_id'].forEach(function(col) {
        if (b[col]) { var sel = el.querySelector('select[data-agent="'+a.id+'"][data-col="'+col+'"]'); if(sel) sel.value = b[col]; }
      });
    });
  } catch(e) { el.innerHTML = '<div class="warn">Error: ' + e.message + '</div>'; }
}

function saveBid(agentId) {
  clearTimeout(bidTimers[agentId]);
  bidTimers[agentId] = setTimeout(async function() {
    var sels = document.querySelectorAll('select[data-agent="'+agentId+'"]');
    var p1 = parseInt(sels[0] && sels[0].value) || null;
    var p2 = parseInt(sels[1] && sels[1].value) || null;
    var p3 = parseInt(sels[2] && sels[2].value) || null;
    await apiFetch('/bids','POST',{agent_id:agentId,pref1_shift_id:p1,pref2_shift_id:p2,pref3_shift_id:p3});
    showToast('Bid saved!');
  }, 400);
}

// ── LIVE VIEW ─────────────────────────────────────────────
async function renderLiveView(paneId) {
  var el = document.getElementById(paneId); if (!el) return;
  try {
    await fetchBiddingStatus(); updateBidStatusBadge();
    var agents = await apiFetch('/agents?type=' + TYPE);
    var shifts = await apiFetch('/shifts?type=' + TYPE);
    var bids   = await apiFetch('/bids?type=' + TYPE);
    if (!shifts.length) { el.innerHTML = '<div class="card"><div class="empty">No shifts added yet.</div></div>'; return; }
    var bidMap = {};
    bids.forEach(function(b) { bidMap[b.agent_id] = b; });
    var shiftMap = {};
    shifts.forEach(function(s) { shiftMap[s.id] = {shift:s,contenders:[]}; });
    agents.forEach(function(a) {
      var b = bidMap[a.id]; if (!b) return;
      [['pref1_shift_id',1],['pref2_shift_id',2],['pref3_shift_id',3]].forEach(function(arr) {
        var sid = b[arr[0]]; if (sid && shiftMap[sid]) shiftMap[sid].contenders.push({agent:a,pref:arr[1]});
      });
    });
    var taken = {}; var winners = {};
    agents.forEach(function(a) {
      var b = bidMap[a.id] || {};
      ['pref1_shift_id','pref2_shift_id','pref3_shift_id'].forEach(function(col) {
        var sid = b[col]; if (sid && !taken[sid]) { taken[sid] = true; winners[sid] = a.id; return; }
      });
    });
    var html = '<div class="card" style="margin-bottom:12px"><div class="card-head" style="margin-bottom:4px">' +
      '<span class="card-title">Live bid board &mdash; '+TYPE+'</span>' +
      '<span style="font-size:11px;color:var(--text3)">Refreshes every 4s</span></div>' +
      '<p style="font-size:12px;color:var(--text3)">Purple = projected winner &middot; Contested = multiple bidders</p></div>';
    if (!bids.length) html += '<div class="empty">No bids placed yet.</div>';
    html += '<div class="live-grid">';
    shifts.forEach(function(s) {
      var info = shiftMap[s.id];
      var winnerId = winners[s.id];
      var winner = winnerId ? agents.find(function(a) { return a.id === winnerId; }) : null;
      var others = info.contenders.filter(function(c) { return c.agent.id !== winnerId; });
      html += '<div class="live-card"><div class="live-shift-head"><span>'+s.name+'</span>' +
        (others.length ? '<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:10px;font-weight:600">Contested</span>' : '') +
        '</div>';
      if (winner) {
        html += '<div class="live-winner"><span style="font-size:14px">&#128081;</span><span class="live-winner-name">'+(winner.name||winner.pos_id)+'</span><span class="live-winner-score">'+winner.adherence+'%</span></div>';
      } else {
        html += '<div class="live-empty">No bids yet</div>';
      }
      others.slice(0,3).forEach(function(c) {
        html += '<div class="live-contender"><div class="contested-dot"></div><span class="live-contender-name">'+(c.agent.name||c.agent.pos_id)+'</span><span class="live-contender-score">'+c.agent.adherence+'% &middot; '+c.pref+(c.pref===1?'st':c.pref===2?'nd':'rd')+'</span></div>';
      });
      if (others.length > 3) html += '<div style="font-size:11px;color:var(--text3);padding:4px 9px">+'+(others.length-3)+' more</div>';
      html += '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="warn">Error: ' + e.message + '</div>'; }
}

// ── RESULTS ───────────────────────────────────────────────
async function renderAdminResults() {
  if (resultsTimer) { clearInterval(resultsTimer); resultsTimer = null; }
  await refreshResults();
  resultsTimer = setInterval(function() {
    if (adminTab === 'results') refreshResults();
    else { clearInterval(resultsTimer); resultsTimer = null; }
  }, 5000);
}

async function refreshResults() {
  var el = document.getElementById('apane-results'); if (!el) return;
  try {
    var agents = await apiFetch('/agents?type=' + TYPE);
    var shifts = await apiFetch('/shifts?type=' + TYPE);
    var bids   = await apiFetch('/bids?type=' + TYPE);
    var taken = {};
    var results = agents.map(function(agent) {
      var b = bids.find(function(b) { return b.agent_id === agent.id; }) || {};
      var shiftName = null; var prefUsed = null;
      [['pref1_shift_id',1],['pref2_shift_id',2],['pref3_shift_id',3]].forEach(function(arr) {
        if (shiftName) return;
        var sid = b[arr[0]];
        if (sid && !taken[sid]) { var shift = shifts.find(function(s) { return s.id === sid; }); if (shift) { taken[sid] = true; shiftName = shift.name; prefUsed = arr[1]; } }
      });
      return {agent:agent,shiftName:shiftName,prefUsed:prefUsed};
    });
    var unassigned = results.filter(function(r) { return !r.shiftName; }).length;
    var lastUpdate = new Date().toLocaleTimeString();
    var html = '<div class="card"><div class="card-head"><span class="card-title">Live assignment &mdash; '+TYPE+'</span>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<span style="font-size:11px;color:var(--text3)">Updated '+lastUpdate+'</span>' +
      '<button class="btn-ghost" onclick="exportResultsCSV()" style="height:30px;font-size:11px">&#8681; Export CSV</button>' +
      '<button class="btn-primary" onclick="saveAssignment()" style="height:30px;font-size:11px">&#128190; Save final</button>' +
      '</div></div>' +
      '<p style="font-size:12px;color:var(--text3);margin-bottom:14px">Auto-updates every 5s. Hit "Save final" to lock results.</p>' +
      (unassigned ? '<div class="warn">&#9888; '+unassigned+' agent(s) unassigned.</div>' : '<div class="success-msg">&#10003; All agents assigned.</div>');
    results.forEach(function(r, i) {
      html += '<div class="res-row"><div class="rank-num '+rankClass(i)+'">'+(i+1)+'</div>' +
        '<span style="flex:1;font-weight:500;font-size:13px">'+(r.agent.name||r.agent.pos_id)+'</span>' +
        '<span style="font-size:11px;color:var(--text3);min-width:58px">'+r.agent.adherence+'% adh</span>' +
        (r.shiftName ? '<span class="shift-pill">'+r.shiftName+'</span>' : '<span class="no-shift">Unassigned</span>') +
        (r.prefUsed ? '<span class="pref-note">'+r.prefUsed+(r.prefUsed===1?'st':r.prefUsed===2?'nd':'rd')+' choice</span>' : '') +
        '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
    window._lastResults = results;
  } catch(e) { el.innerHTML = '<div class="warn">Error: ' + e.message + '</div>'; }
}

async function saveAssignment() {
  await apiFetch('/results','POST',{type:TYPE}); showToast('Results saved!');
}

function exportResultsCSV() {
  if (!window._lastResults) return;
  var csv = 'Rank,Agent,POS ID,Adherence %,Shift,Preference\n';
  window._lastResults.forEach(function(r, i) {
    csv += '"'+(i+1)+'","'+(r.agent.name||'')+'","'+(r.agent.pos_id||'')+'","'+r.agent.adherence+'","'+(r.shiftName||'Unassigned')+'","'+(r.prefUsed?r.prefUsed+(r.prefUsed===1?'st':r.prefUsed===2?'nd':'rd')+' choice':'—')+'"\n';
  });
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'tarrobid_' + TYPE + '_results.csv'; a.click();
}

// ── ARCHIVE ───────────────────────────────────────────────
async function renderAdminArchive() {
  var el = document.getElementById('apane-archive');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span>Loading...</div>';
  try {
    var list = await apiFetch('/archive');
    var html = '<div class="card"><div class="card-head"><span class="card-title">Past months</span><span class="cnt-badge">'+list.length+' archived</span></div>';
    if (!list.length) {
      html += '<div class="empty">No archives yet.</div>';
    } else {
      list.forEach(function(a) {
        html += '<div class="archive-row">' +
          '<span class="archive-month">'+a.month_label+'</span>' +
          '<span class="archive-type">'+a.agent_type+'</span>' +
          '<span class="archive-date">'+new Date(a.archived_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</span>' +
          '<button class="btn-ghost" style="height:28px;font-size:11px" onclick="viewArchive('+a.id+')">View</button>' +
          '<button class="btn-danger" style="height:28px;font-size:11px" onclick="delArchive('+a.id+',\''+a.month_label+'\')">Delete</button>' +
          '</div>';
      });
    }
    html += '</div><div id="archive-detail"></div>';
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="warn">Error: ' + e.message + '</div>'; }
}

async function viewArchive(id) {
  var entry = await apiFetch('/archive?id='+id);
  var data = entry.data;
  var html = '<div class="card"><div class="card-head"><span class="card-title">'+entry.month_label+' &mdash; '+entry.agent_type+'</span><button class="btn-ghost" onclick="document.getElementById(\'archive-detail\').innerHTML=\'\'">Close</button></div>';
  data.results.forEach(function(r, i) {
    html += '<div class="res-row"><div class="rank-num '+rankClass(i)+'">'+(i+1)+'</div>' +
      '<span style="flex:1;font-weight:500;font-size:13px">'+r.agent_name+'</span>' +
      '<span style="font-size:11px;color:var(--text3)">'+r.adherence+'% adh</span>' +
      (r.shift_name ? '<span class="shift-pill">'+r.shift_name+'</span>' : '<span class="no-shift">Unassigned</span>') +
      '</div>';
  });
  html += '</div>';
  document.getElementById('archive-detail').innerHTML = html;
}

async function delArchive(id, label) {
  if (!confirm('Delete archive for "'+label+'"? This cannot be undone.')) return;
  await apiFetch('/archive?id='+id,'DELETE'); showToast('Archive deleted','warn'); await renderAdminArchive();
}

// ── RESET ─────────────────────────────────────────────────
function openReset() {
  var d = new Date(); d.setMonth(d.getMonth()+1);
  document.getElementById('month-label').value = d.toLocaleString('default',{month:'long'})+' '+d.getFullYear();
  document.getElementById('reset-msg').innerHTML = '';
  document.getElementById('reset-modal').style.display = 'flex';
}
function closeReset() { document.getElementById('reset-modal').style.display = 'none'; }
async function doReset() {
  var label = document.getElementById('month-label').value.trim(); if (!label) return;
  var msgEl = document.getElementById('reset-msg');
  msgEl.innerHTML = '<span class="spinner"></span>Archiving...';
  try {
    var res = await apiFetch('/reset','POST',{month_label:label,type:TYPE});
    msgEl.innerHTML = '<div class="success-msg">&#10003; '+res.message+'</div>';
    setTimeout(function() { closeReset(); goAdmin('ranking'); }, 1500);
  } catch(e) { msgEl.innerHTML = '<div class="warn">Error: '+e.message+'</div>'; }
}

// ── AGENT SHELL ───────────────────────────────────────────
function renderAgentShell() {
  try { updateBidStatusBadge(); } catch(e) {}
  updateTypeBadge();
  var hdRight = document.getElementById('hd-right');
  var pill = hdRight ? hdRight.querySelector('.user-pill') : null;
  if (!pill) { pill = document.createElement('span'); pill.className = 'user-pill'; if(hdRight) hdRight.appendChild(pill); }
  pill.innerHTML = (currentAgent.name||currentAgent.pos_id) + ' <button class="logout-btn" onclick="refreshAgent()" title="Refresh">&#8635;</button> <button class="logout-btn" onclick="renderLanding()">&times; Exit</button>';
  document.getElementById('screen-agent').innerHTML =
    '<div class="nav"><button class="ntab active" id="agent-tab-bid" onclick="goAgent(\'bid\')">My Bid</button><button class="ntab" id="agent-tab-live" onclick="goAgent(\'live\')">Live View</button></div>' +
    '<div id="agent-pane-bid"></div>' +
    '<div id="agent-pane-live" style="display:none"></div>';
  showScreen('agent');
  goAgent('bid');
}

function goAgent(tab) {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  ['bid','live'].forEach(function(t) {
    document.getElementById('agent-pane-'+t).style.display = t===tab ? 'block' : 'none';
    document.getElementById('agent-tab-'+t).classList.toggle('active', t===tab);
  });
  if (tab === 'bid')  renderAgentBid();
  if (tab === 'live') { renderLiveView('agent-pane-live'); liveTimer = setInterval(function() { renderLiveView('agent-pane-live'); }, 4000); }
}

function refreshAgent() { renderAgentBid(); showToast('Refreshed'); }

async function renderAgentBid() {
  var el = document.getElementById('agent-pane-bid');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span>Loading...</div>';
  try {
    await fetchBiddingStatus(); updateBidStatusBadge();
    var ann = await fetchAnnouncement();
    var agents = await apiFetch('/agents?type=' + TYPE);
    var shifts = await apiFetch('/shifts?type=' + TYPE);
    var bids   = await apiFetch('/bids?type=' + TYPE);
    var sorted = agents.slice().sort(function(a,b) { return b.adherence !== a.adherence ? b.adherence - a.adherence : a.aht - b.aht; });
    var myRank = sorted.findIndex(function(a) { return a.id === currentAgent.id; }) + 1;
    var myBid  = bids.find(function(b) { return b.agent_id === currentAgent.id; }) || {};
    var opts   = shifts.map(function(s) { return '<option value="'+s.id+'">'+s.name+'</option>'; }).join('');
    var locked = !biddingOpen;

    // Compute which shifts are taken based on current bids
    var takenShiftIds = {};
    var sortedForBidding = agents.slice().sort(function(a,b){ return b.adherence !== a.adherence ? b.adherence - a.adherence : a.aht - b.aht; });
    var takenSet = {};
    sortedForBidding.forEach(function(a) {
      var b = bids.find(function(b){ return b.agent_id === a.id; }) || {};
      ['pref1_shift_id','pref2_shift_id','pref3_shift_id'].forEach(function(col) {
        var sid = b[col];
        if (sid && !takenSet[sid]) { takenSet[sid] = true; takenShiftIds[sid] = true; }
      });
    });
    var openCount = shifts.filter(function(s){ return !takenShiftIds[s.id]; }).length;
    var takenCount = shifts.length - openCount;

    var html = '<div class="agent-bid-wrap">';
    if (ann && ann.trim()) {
      html += '<div class="ann-banner"><div class="ann-icon">&#128226;</div><div><span class="ann-tag">Announcement</span><div class="ann-text">'+ann+'</div></div></div>';
    }

    // Available shifts section
    if (shifts.length) {
      html += '<div class="card" style="margin-bottom:12px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
        '<span style="font-size:13px;font-weight:600;color:var(--p900)">Available shifts</span>' +
        '<span style="font-size:11px;color:var(--text3)">'+openCount+' open &middot; '+takenCount+' taken</span>' +
        '</div>';
      shifts.forEach(function(s) {
        var taken = !!takenShiftIds[s.id];
        html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:5px">' +
          '<div style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:'+(taken?'#cbd5e1':'#10b981')+'""></div>' +
          '<span style="flex:1;font-size:12px;font-weight:500;color:'+(taken?'var(--text3)':'var(--text)')+';'+(taken?'text-decoration:line-through':'')+'">' + s.name + '</span>' +
          '<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:'+(taken?'#f1f5f9':'#f0fdf4')+';color:'+(taken?'var(--text3)':'#15803d')+'">'+(taken?'Taken':'Open')+'</span>' +
          '</div>';
      });
      html += '</div>';
    }

    html += (locked
      ? '<div class="bid-closed-banner"><h3>&#128308; Bidding is closed</h3><p>Your TL will open bidding shortly.</p></div>'
      : '<div class="bid-open-banner"><p>&#128994; Bidding is open &mdash; select your shift preferences below.</p></div>') +
      '<div class="agent-bid-card">' +
      '<div class="agent-name-display">'+(currentAgent.name||currentAgent.pos_id)+'</div>' +
      '<div class="agent-rank-display">Rank #'+myRank+' &middot; '+TYPE+' &middot; Adherence: '+currentAgent.adherence+'% &middot; AHT: '+currentAgent.aht+'s</div>' +
      [['ap1','1st choice','p1-lbl'],['ap2','2nd choice','p2-lbl'],['ap3','3rd choice','p3-lbl']].map(function(arr) {
        return '<div class="agent-pref-item"><span class="agent-pref-lbl '+arr[2]+'">'+arr[1]+'</span>' +
          '<select class="agent-pref-sel" id="'+arr[0]+'" '+(locked?'disabled':'')+'>'+
          '<option value="">-- pick a shift --</option>'+opts+'</select></div>';
      }).join('') +
      '<button class="agent-save-btn" onclick="saveAgentBid()" '+(locked?'disabled':'')+'>Save my preferences</button>' +
      (!locked ? '<p style="font-size:11px;color:var(--text3);text-align:center;margin-top:8px">You can update your preferences anytime while bidding is open.</p>' : '') +
      '<div id="agent-bid-msg" style="margin-top:10px;font-size:12px;text-align:center"></div>' +
      '</div></div>';
    el.innerHTML = html;
    if (myBid.pref1_shift_id) document.getElementById('ap1').value = myBid.pref1_shift_id;
    if (myBid.pref2_shift_id) document.getElementById('ap2').value = myBid.pref2_shift_id;
    if (myBid.pref3_shift_id) document.getElementById('ap3').value = myBid.pref3_shift_id;
  } catch(e) { el.innerHTML = '<div class="warn">Error: ' + e.message + '</div>'; }
}

async function saveAgentBid() {
  var p1 = parseInt(document.getElementById('ap1').value) || null;
  var p2 = parseInt(document.getElementById('ap2').value) || null;
  var p3 = parseInt(document.getElementById('ap3').value) || null;
  var msgEl = document.getElementById('agent-bid-msg');
  try {
    await apiFetch('/bids','POST',{agent_id:currentAgent.id,pref1_shift_id:p1,pref2_shift_id:p2,pref3_shift_id:p3});
    msgEl.innerHTML = '<span style="color:var(--green)">&#10003; Preferences saved!</span>';
    showToast('Bid saved!');
    setTimeout(function() { msgEl.innerHTML = ''; }, 3000);
  } catch(e) { msgEl.innerHTML = '<span style="color:var(--red)">Error saving. Try again.</span>'; }
}

init();
</script>
